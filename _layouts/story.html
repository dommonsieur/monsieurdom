---
layout: default
---
{%- assign t = site.data.i18n[page.lang] %}
  <a class="back" href="{{ t.home }}">← {{ site.title }}</a>

  <header>
    <p class="series">{{ t.story_series }}</p>
    <h1>{{ page.title }}</h1>
    <p class="subtitle">{{ page.subtitle }}</p>
  </header>

{{ content }}

  <p class="signoff">{{ t.story_signoff }}</p>

  <aside class="invite">
    <p>{{ t.story_invite }}</p>
    <p><a class="button" href="{{ t.home }}#write">{{ t.write_to_me }}</a></p>
  </aside>
