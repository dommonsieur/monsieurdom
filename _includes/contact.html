{%- assign t = site.data.i18n[page.lang] %}
  <div class="contact" id="write">
    <h2>{{ t.contact_heading }}</h2>
    <a class="how" href="mailto:{{ site.contact_email }}?subject={{ site.contact_subject | uri_escape }}">{{ t.write_to_me }}</a>
    <p class="address">{{ site.contact_email }}</p>
    <p>{{ t.contact_hint }}</p>
  </div>
